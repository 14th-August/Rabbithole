<!--
  Signup confirmation email.

  Sends a 6-digit code ({{ .Token }}) rather than a link
  ({{ .ConfirmationURL }}). Links require deep-linking back into the app, which
  is fragile across mobile mail clients and needs per-platform configuration;
  a code the user types works identically on iOS, Android, and web.

  The hosted project needs the equivalent set by hand:
  Dashboard -> Auth -> Email Templates -> Confirm signup.

  Three constraints shape the markup, none of them preference:

  1. TABLES, not flex or grid. Outlook on Windows renders with Word's engine,
     which has no modern CSS layout. Nested tables are the only layout that
     survives every client.
  2. INLINE styles only. Gmail strips <style> blocks, so a class-based rule
     silently does nothing there and the email arrives unstyled.
  3. The logo is an absolute https URL, not a local file or a data: URI. Mail
     clients cannot read repo files, and Gmail blocks data: URIs in <img> —
     it would render as a broken image for most students. This points at the
     committed asset on the default branch, so it requires the repo stay
     public. If that changes, move the file to a public Storage bucket and
     swap the src.

  Colours are hardcoded, which is correct exactly here: an email cannot import
  useTheme(). They mirror src/theme/palette.ts — #0165F2 is blue[500] (the
  brand), #E5F0FF is blue[50], #12161D is neutral[900].
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0; padding:0; background-color:#F7F8FA;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:480px; background-color:#FFFFFF; border-radius:14px; overflow:hidden;">

        <!-- Brand band. The rabbit carries alt text because many clients block
             remote images by default, and the email must still make sense. -->
        <tr>
          <td align="center" style="background-color:#0165F2; padding:28px 24px;">
            <img src="https://raw.githubusercontent.com/14th-August/Rabbithole/main/rabbithole/assets/images/logo-round.png"
                 width="64" height="64" alt="Rabbithole"
                 style="display:block; width:64px; height:64px; border-radius:32px; border:0; outline:none; text-decoration:none;">
          </td>
        </tr>

        <tr>
          <td style="padding:32px 32px 8px 32px;">
            <h1 style="margin:0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:22px; line-height:28px; font-weight:700; color:#12161D; text-align:center;">
              Confirm your account
            </h1>
          </td>
        </tr>

        <tr>
          <td style="padding:0 32px 24px 32px;">
            <p style="margin:0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:22px; color:#4C5566; text-align:center;">
              Enter this code in the app to finish signing up.
            </p>
          </td>
        </tr>

        <!-- The code. Its own table so the tinted card hugs the digits rather
             than stretching edge to edge. -->
        <tr>
          <td align="center" style="padding:0 32px 8px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#E5F0FF; border-radius:10px; padding:18px 28px;">
                  <span style="font-family:'SF Mono',Menlo,Consolas,monospace; font-size:32px; line-height:38px; font-weight:700; letter-spacing:8px; color:#0165F2;">
                    {{ .Token }}
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 32px 32px 32px;">
            <p style="margin:0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:19px; color:#6B7688; text-align:center;">
              The code expires in one hour. If you didn&rsquo;t sign up for Rabbithole,
              you can safely ignore this email.
            </p>
          </td>
        </tr>

      </table>

      <p style="margin:20px 0 0 0; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#9AA4B4; text-align:center;">
        Rabbithole &middot; a student marketplace for Vancouver Island University
      </p>

    </td>
  </tr>
</table>
